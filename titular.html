<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direitos do titular de dados | Acella</title><meta name="theme-color" content="#052e57">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;background:#f3f8fc;color:#142638;line-height:1.55}header{background:#052e57;padding:16px 20px}header img{height:34px}main{max-width:620px;margin:0 auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #d9e5ef;border-radius:16px;padding:22px}h1{color:#052e57;font-size:1.5rem;margin:0 0 6px}label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}input,select,textarea{width:100%;border:1.5px solid #d9e5ef;border-radius:10px;padding:10px;font:inherit}button{margin-top:16px;width:100%;background:#052e57;color:#fff;border:0;border-radius:12px;padding:13px;font:600 1rem Outfit,sans-serif;cursor:pointer}.s{font-size:.88rem;color:#52667a}.err{color:#b3261e}</style></head>
<body><header><a href="index.html"><img src="assets/logo-light.png" alt="Acella"></a></header><main><div class="card" id="c"><h1>Direitos do titular de dados</h1><p class="s">Pela LGPD (art. 18), você pode pedir informações sobre os seus dados pessoais tratados pela Acella. Respondemos em até 15 dias.</p>
<form id="f"><label for="t">O que você deseja?</label><select id="t" required></select><label for="n">Seu nome</label><input id="n" required maxlength="200"><label for="k">E-mail ou telefone para resposta</label><input id="k" required maxlength="200"><label for="d">Detalhes (opcional)</label><textarea id="d" rows="4" maxlength="2000"></textarea><p class="s">Para sua segurança, podemos pedir confirmação de identidade antes de entregar dados.</p><p class="err" id="e" role="alert"></p><button>Enviar solicitação</button></form></div></main>
<script>const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('/api/public/direitos').then(r=>r.json()).then(l=>$('t').innerHTML=l.map(x=>`<option>${esc(x)}</option>`).join('')).catch(()=>$('e').textContent='Serviço indisponível no momento.');
$('f').onsubmit=async e=>{e.preventDefault();try{const r=await fetch('/api/public/titular',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:$('t').value,nome:$('n').value,contato:$('k').value,detalhe:$('d').value})}),j=await r.json();if(!r.ok)throw new Error(j.erro);$('c').innerHTML=`<h1>Solicitação registrada</h1><p>Protocolo: <b>${esc(j.protocolo)}</b></p><p class="s">${esc(j.mensagem)}</p>`}catch(x){$('e').textContent=x.message==='Failed to fetch'?'Não foi possível enviar agora.':x.message}}</script></body></html>
