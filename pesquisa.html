<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisa | Acella</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#052e57">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Outfit,system-ui,sans-serif;background:#f3f8fc;color:#142638;line-height:1.55}
header{background:#052e57;padding:16px 20px}header img{height:34px}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
.card{background:#fff;border:1px solid #d9e5ef;border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:1.4rem;color:#052e57;margin:.2em 0}p.s{color:#52667a;font-size:.92rem}
.q{font-weight:600;margin:0 0 10px}.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opts label{border:1.5px solid #d9e5ef;border-radius:12px;padding:10px 2px;text-align:center;font-size:.72rem;cursor:pointer;line-height:1.2;min-height:56px;display:flex;align-items:center;justify-content:center}
.opts input{position:absolute;opacity:0}.opts label:has(input:checked){background:#01aaa2;color:#fff;border-color:#01aaa2;font-weight:600}.opts label:has(input:focus-visible){outline:3px solid #ffc807}
textarea{width:100%;min-height:90px;border:1.5px solid #d9e5ef;border-radius:12px;padding:10px;font:inherit}
button{width:100%;background:#052e57;color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:1.05rem;cursor:pointer}
.err{color:#b3261e;min-height:1.4em}.ok{text-align:center;padding:30px 10px}.ok h1{font-size:1.8rem}
@media(max-width:420px){.opts label{font-size:.66rem}}
</style></head><body><header><img src="assets/logo-light.png" alt="Acella"></header><main id="m"><p>Carregando…</p></main>
<script>
const QC=new URLSearchParams(location.search).get('c')||'';
const F=['Nunca','Raramente','Às vezes','Frequentemente','Sempre'],C=['Discordo totalmente','Discordo','Neutro','Concordo','Concordo totalmente'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),m=document.getElementById('m'),t=new URLSearchParams(location.search).get('t');
(async()=>{try{const r=await fetch('/api/public/survey/'+encodeURIComponent(t||'-')),d=await r.json();if(!r.ok)throw new Error(d.erro);
 m.innerHTML=`<h1>${esc(d.nome)}</h1><p class="s">${esc(d.empresa)} · Leva cerca de 5 minutos. Suas respostas são <b>anônimas</b>: não pedimos nome, e a empresa só vê resultados agrupados. As respostas ajudam a melhorar o ambiente de trabalho.</p><form id="f">${d.por_codigo&&!QC?`<div class="card"><p class="q">Seu código de acesso</p><input id="cod" required autocomplete="off" style="width:100%;padding:12px;border:1.5px solid #d9e5ef;border-radius:12px;font:inherit;text-transform:uppercase"></div>`:''}${d.perguntas.map((q,i)=>`<div class="card"><p class="q">${esc(q.texto)}</p>${q.tipo==='texto'?`<textarea name="${q.id}" maxlength="1000" placeholder="Opcional. Não escreva seu nome nem de outras pessoas."></textarea>`:`<div class="opts" role="radiogroup">${(q.tipo==='frequencia'?F:C).map((l,k)=>`<label><input type="radio" name="${q.id}" value="${k+1}">${l}</label>`).join('')}</div>`}</div>`).join('')}<div class="err" id="e" role="alert"></div><button>Enviar respostas</button></form>`;
 document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a={};new FormData(e.target).forEach((v,k)=>{if(v)a[k]=v});
  const r2=await fetch('/api/public/survey/'+encodeURIComponent(t),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:a,codigo:QC||(document.getElementById('cod')||{}).value||''})}),j=await r2.json();
  if(r2.ok)m.innerHTML='<div class="card ok"><h1>Obrigado por participar!</h1><p>Sua resposta foi registrada de forma anônima. Você já pode fechar esta página.</p></div>';else document.getElementById('e').textContent=j.erro||'Erro ao enviar.'}}
catch(e){m.innerHTML=`<div class="card ok"><h1>Pesquisa indisponível</h1><p>${esc(e.message||'Tente novamente mais tarde.')}</p></div>`}})();
</script></body></html>
