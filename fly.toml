# Acella na Fly.io (região São Paulo). Veja NUVEM.md
app = "acella-CHANGE-ME"      # troque por um nome único
primary_region = "gru"

[build]

[env]
  ACELLA_DATA = "/data"
  ACELLA_HOST = "0.0.0.0"
  ACELLA_HTTPS = "1"
  ACELLA_TRUST_PROXY = "1"
  PORT = "3000"

[mounts]
  source = "acella_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
